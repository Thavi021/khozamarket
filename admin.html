<script>

// ✅ FIXED CONFIG (IMPORTANT)
const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5dnRqY256ZWloc3F2cHprY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjAxODAsImV4cCI6MjA5NjEzNjE4MH0.YcMI_AKjUczeecLQcNq6OyPcfxOe7Z21hvacVW6qTfM";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ✅ ✅ CHECK ADMIN ACCESS
async function checkAdmin() {

    const { data: { user } } = await client.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return false;
    }

    const { data, error } = await client
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

    if (error || !data || data.role !== "admin") {
        document.body.innerHTML = "❌ Admin access only";
        return false;
    }

    return true;
}

// ✅ ✅ LOAD STATS (FIXED)
async function loadStats() {

    const isAdmin = await checkAdmin();
    if (!isAdmin) return;

    console.log("Loading dashboard stats...");

    // ✅ USERS (profiles table, not auth!)
    const { count: usersCount } = await client
        .from('profiles')
        .select('*', { count: 'exact', head: true });

    // ✅ ORDERS
    const { count: ordersCount } = await client
        .from('orders')
        .select('*', { count: 'exact', head: true });

    // ✅ PRODUCTS
    const { count: productsCount } = await client
        .from('products')
        .select('*', { count: 'exact', head: true });

    document.getElementById("userCount").innerText = usersCount || 0;
    document.getElementById("orderCount").innerText = ordersCount || 0;
    document.getElementById("productCount").innerText = productsCount || 0;
}

// ✅ INIT
loadStats();

</script>
