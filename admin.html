<!DOCTYPE html>
<html>
<head>

<style>
body{font-family:'Segoe UI';background:#0f172a;color:#fff;margin:0;}
header{background:#020617;padding:15px 40px;color:#facc15;}
.container{padding:40px;}

.cards{display:flex;gap:20px;margin-bottom:30px;}
.card{background:#1e293b;padding:20px;border-radius:10px;flex:1;text-align:center;}
.card h2{color:#facc15;}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#facc15;
    cursor:pointer;
}
</style>

</head>
<body>

<header>
<h2>Admin Dashboard</h2>
</header>

<div class="container">

<h1>Overview</h1>

<div class="cards">
<div class="card">
<h2 id="userCount">0</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2 id="orderCount">0</h2>
<p>Total Orders</p>
</div>

<div class="card">
<h2 id="productCount">0</h2>
<p>Products</p>
</div>
</div>

<h2>Management</h2>

<a href="users.html"><button>User Management</button></a>
<a href="products-admin.html"><button>Product Management</button></a>
<a href="orders.html"><button>Order Monitoring</button></a>

<br><br>
<a href="index.html">
<button style="background:#334155;color:white;">Back to Site</button>
</a>

</div>

<!-- ✅ SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

// ✅ CONFIG
const SUPABASE_URL = "https://qhzyesapzldfufygaopz.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ LOAD DASHBOARD STATS
async function loadStats() {

    console.log("Loading dashboard stats...");

    // ✅ Orders count
    const { count: ordersCount } = await supabaseClient
        .from('orders')
        .select('*', { count: 'exact', head: true });

    // ✅ Products count
    const { count: productsCount } = await supabaseClient
        .from('products')
        .select('*', { count: 'exact', head: true });

    // ⚠️ USERS COUNT (special case)
    // Cannot directly query auth users from frontend securely
    // So for now we display placeholder OR later create profiles table

    document.getElementById("userCount").innerText = "N/A";
    document.getElementById("orderCount").innerText = ordersCount || 0;
    document.getElementById("productCount").innerText = productsCount || 0;
}

// ✅ INIT
loadStats();

</script>

</body>
</html>
