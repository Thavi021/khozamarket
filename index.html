<!DOCTYPE html>
<html>
<head>
  <title>Products</title>

  <!-- ✅ Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Products</h1>

<div id="products"></div>

<script>
  // ✅ Your Supabase details
  const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5dnRqY256ZWloc3F2cHprY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjAxODAsImV4cCI6MjA5NjEzNjE4MH0.YcMI_AKjUczeecLQcNq6OyPcfxOe7Z21hvacVW6qTfM";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ✅ Load products
  async function loadProducts() {
    const { data, error } = await supabase
      .from('products')
      .select('*');

    console.log("DATA:", data);
    console.log("ERROR:", error);

    const container = document.getElementById('products');

    if (error) {
      container.innerHTML = "Error loading products";
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = "No products found";
      return;
    }

    data.forEach(p => {
      const div = document.createElement('div');
      div.innerHTML = `
        <h3>${p.name}</h3>
        <p>Price: R${p.price}</p>
        <p>Seller: ${p.seller_name}</p>
        <hr>
      `;
      container.appendChild(div);
    });
  }

  loadProducts();
</script>

</body>
</html>
