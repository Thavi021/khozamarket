<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding: 40px;
}

h1 {
    margin-bottom: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.cart-item {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.price {
    color: #facc15;
    font-weight: bold;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #facc15;
    color: #020617;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #eab308;
}

.total {
    font-size: 20px;
    margin-top: 20px;
}

.empty {
    color: #94a3b8;
}

.checkout-btn {
    width: 100%;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <div id="total"></div>

    <button class="checkout-btn" onclick="checkout()">
        Checkout
    </button>
</div>

<script>
function loadCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const container = document.getElementById("cart-items");
    const totalDiv = document.getElementById("total");

    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = "<p class='empty'>Your cart is empty</p>";
        totalDiv.innerHTML = "";
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        total += item.price;

        container.innerHTML += `
            <div class="cart-item">
                <h3>${item.name}</h3>
                <p class="price">R${item.price}</p>
                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    totalDiv.innerHTML = `<p class="total">Total: R${total}</p>`;
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    loadCart();
}

function checkout() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty");
        return;
    }

    alert("🚀 Next step: connect to orders table");

    // 🔥 Future: send to Supabase orders table
}

loadCart();
</script>

</body>
</html>
