<!DOCTYPE html>
<html>
<head>
<title>Cart</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:'Segoe UI';
}

.container{
    padding:40px;
}

.item{
    background:#1e293b;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

button{
    padding:10px;
    background:#facc15;
    border:none;
    cursor:pointer;
    margin-top:10px;
}

.remove-btn{
    background:red;
    color:white;
    margin-left:10px;
}
</style>

</head>
<body>

<div class="container">
<h1>Your Cart</h1>

<!-- ✅ Dynamic cart items -->
<div id="cartItems"></div>

<h3 id="total">Total: R0</h3>

<button onclick="checkout()">Checkout</button>
</div>

<script>

// ✅ LOAD CART FROM LOCAL STORAGE
function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
}

// ✅ SAVE CART
function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
}

// ✅ DISPLAY CART
function loadCart() {
    const cart = getCart();
    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("total").innerText = "Total: R0";
        return;
    }

    cart.forEach((item, index) => {
        total += Number(item.price);

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <h3>${item.name}</h3>
            <p>Price: R${item.price}</p>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        `;

        container.appendChild(div);
    });

    document.getElementById("total").innerText = "Total: R" + total;
}

// ✅ REMOVE ITEM
function removeItem(index) {
    let cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    loadCart();
}

// ✅ CHECKOUT (for now just alert)
function checkout() {
    const cart = getCart();

    if (cart.length === 0) {
        alert("Cart is empty");
        return;
    }

    alert("Proceeding to checkout... (next step we connect to DB)");
}

// ✅ INITIAL LOAD
loadCart();

</script>

</body>
</html>
