<!DOCTYPE html>
<html>
<head>
<title>Cart</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:'Segoe UI';
}

.container{
    padding:40px;
}

.item{
    background:#1e293b;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

button{
    padding:10px;
    background:#facc15;
    border:none;
    cursor:pointer;
    margin-top:10px;
}

.remove-btn{
    background:red;
    color:white;
    margin-left:10px;
}
</style>

</head>
<body>

<div class="container">
<h1>Your Cart</h1>

<div id="cartItems"></div>

<h3 id="total">Total: R0</h3>

<button onclick="checkout()">Checkout</button>

<p id="message"></p>
</div>

<!-- ✅ SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

// ✅ CONFIG
const SUPABASE_URL = "https://qhzyesapzldfufygaopz.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ CART HANDLING
function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
}

// ✅ DISPLAY CART
function loadCart() {
    const cart = getCart();
    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("total").innerText = "Total: R0";
        return;
    }

    cart.forEach((item, index) => {
        total += Number(item.price);

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <h3>${item.name}</h3>
            <p>Price: R${item.price}</p>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        `;

        container.appendChild(div);
    });

    document.getElementById("total").innerText = "Total: R" + total;
}

// ✅ REMOVE ITEM
function removeItem(index) {
    let cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    loadCart();
}

// ✅ CHECKOUT FUNCTION (REAL IMPLEMENTATION)
async function checkout() {

    const cart = getCart();

    if (cart.length === 0) {
        alert("Cart is empty");
        return;
    }

    // ✅ GET CURRENT USER
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user) {
        alert("You must login first ❌");
        return;
    }

    const total = cart.reduce((sum, item) => sum + Number(item.price), 0);

    // ✅ CREATE ORDER
    const { data: orderData, error: orderError } = await supabaseClient
        .from('orders')
        .insert([{
            user_id: user.id,
            total: total,
            status: "pending"
        }])
        .select()
        .single();

    if (orderError) {
        console.error(orderError);
        document.getElementById("message").innerText = "Order failed ❌";
        return;
    }

    const orderId = orderData.id;

    // ✅ INSERT ORDER ITEMS
    const itemsToInsert = cart.map(item => ({
        order_id: orderId,
        product_id: item.id,
        name: item.name,
        price: item.price
    }));

    const { error: itemsError } = await supabaseClient
        .from('order_items')
        .insert(itemsToInsert);

    if (itemsError) {
        console.error(itemsError);
        document.getElementById("message").innerText = "Items save failed ❌";
        return;
    }

    // ✅ CLEAR CART
    localStorage.removeItem("cart");

    // ✅ SUCCESS
    document.getElementById("message").innerText = "Order placed ✅";

    loadCart();
}

// ✅ INIT
loadCart();

</script>

</body>
</html>
