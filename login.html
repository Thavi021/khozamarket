<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: 'Segoe UI';
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 12px;
    width: 300px;
}

input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 10px;
    background: #facc15;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
    <h2>Login</h2>
    <input id="email" placeholder="Enter email">
    <button onclick="login()">Login</button>

    <p id="msg"></p>
</div>

<script>
const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5dnRqY256ZWloc3F2cHprY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjAxODAsImV4cCI6MjA5NjEzNjE4MH0.YcMI_AKjUczeecLQcNq6OyPcfxOe7Z21hvacVW6qTfM";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ✅ LOGIN
async function login() {

    const email = document.getElementById("email").value;

    const { error } = await client.auth.signInWithOtp({
        email: email,
        options: {
            emailRedirectTo: window.location.origin + "/index.html"
        }
    });

    if (error) {
        document.getElementById("msg").innerText = error.message;
    } else {
        document.getElementById("msg").innerText =
        "✅ Check your email to login!";
    }
}

// ✅ AUTO REDIRECT IF ALREADY LOGGED IN
async function checkSession() {
    const { data: { session } } = await client.auth.getSession();

    if (session) {
        window.location.href = "index.html";
    }
}

checkSession();
</script>

</body>
</html>
