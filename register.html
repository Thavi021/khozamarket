<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:'Segoe UI';
}

.container{
    padding:40px;
    max-width:400px;
    margin:auto;
}

input{
    display:block;
    margin:10px 0;
    padding:10px;
    width:100%;
    border:none;
    border-radius:6px;
}

button{
    background:#facc15;
    padding:10px;
    border:none;
    width:100%;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.message{
    margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<h1>Create Account</h1>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

<p id="message" class="message"></p>

<p>
Already have an account? 
<a href="login.html" style="color:#facc15;">Login</a>
</p>

</div>

<!-- ✅ SUPABASE -->
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js

<script>

const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5dnRqY256ZWloc3F2cHprY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjAxODAsImV4cCI6MjA5NjEzNjE4MH0.YcMI_AKjUczeecLQcNq6OyPcfxOe7z21hvacVW6qTfM";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function register() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
        setMessage("Fill all fields ❌");
        return;
    }

    setMessage("Creating account...");

    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            data: { full_name: name }
        }
    });

    if (error) {
        setMessage(error.message);
        return;
    }

    // ✅ Save profile
    if (data.user) {
        await supabaseClient.from('profiles').insert([{
            id: data.user.id,
            full_name: name
        }]);
    }

    setMessage("Registered ✅ Redirecting...");

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);
}

function setMessage(msg) {
    document.getElementById("message").innerText = msg;
}

</script>

</body>
</html>
