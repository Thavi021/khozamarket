<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding: 40px;
}

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
}

.price {
    color: #facc15;
    font-size: 20px;
    margin-bottom: 10px;
}

.desc {
    margin-bottom: 15px;
    color: #94a3b8;
}

button {
    padding: 10px;
    width: 100%;
    margin-top: 10px;
    background: #facc15;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <div id="product">Loading...</div>
</div>

<script>
// ✅ Supabase
const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co";
const SUPABASE_KEY = "YOUR_KEY_HERE";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ✅ LOAD PRODUCT (FIXED)
async function loadProduct() {

    const params = new URLSearchParams(window.location.search);
    let id = params.get("id");

    console.log("Raw ID:", id);

    // ✅ Convert safely
    id = parseInt(id);

    if (!id) {
        document.getElementById("product").innerHTML = "Invalid product ID";
        return;
    }

    const { data, error } = await client
        .from('products')
        .select('*')
        .eq('id', id);

    console.log("DATA:", data);
    console.log("ERROR:", error);

    const container = document.getElementById("product");

    if (error || !data || data.length === 0) {
        container.innerHTML = "<p>❌ Product not found</p>";
        return;
    }

    const p = data[0]; // ✅ get first result safely

    container.innerHTML = `
        <div class="card">
            <h1>${p.name}</h1>
            <p class="price">R${p.price}</p>
            <p class="desc">${p.description || "No description available"}</p>
            <p>Seller: ${p.seller_name}</p>

            <button onclick='addToCart(${p.id}, ${JSON.stringify(p.name)}, ${p.price})'>
                Add to Cart
            </button>

            <button onclick="buyNow(${p.id})">
                Buy Now
            </button>
        </div>
    `;
}

// ✅ ADD TO CART (FIXED + REDIRECT)
function addToCart(id, name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        alert("✅ Already in cart");
        setTimeout(() => window.location.replace("index.html"), 300);
        return;
    }

    cart.push({ id, name, price });

    localStorage.setItem("cart", JSON.stringify(cart));

    console.log("UPDATED CART:", cart);

    alert("✅ Added to cart!");

    setTimeout(() => {
        window.location.replace("index.html");
    }, 300);
}

// ✅ BUY NOW
function buyNow(id) {
    alert("🚀 Checkout coming next");
}

loadProduct();
</script>

</body>
</html>
