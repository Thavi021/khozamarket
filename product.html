<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details</title>

<!-- ✅ Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding: 40px;
}

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
}

h1 { margin-bottom: 10px; }

.price {
    color: #facc15;
    font-size: 20px;
    margin-bottom: 10px;
}

.desc {
    margin-bottom: 15px;
    color: #94a3b8;
}

button {
    padding: 10px;
    width: 100%;
    margin-top: 10px;
    background: #facc15;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #eab308;
}
</style>
</head>

<body>

<div class="container">
    <div id="product">Loading...</div>
</div>

<script>
// ✅ Supabase connection
const SUPABASE_URL = "https://lyvtjcnzeihsqvpzkced.supabase.co";
const SUPABASE_KEY = "YOUR_KEY_HERE";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ✅ LOAD PRODUCT
async function loadProduct() {

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    console.log("Product ID:", id);

    if (!id) {
        document.getElementById("product").innerHTML = "No product ID in URL";
        return;
    }

    const { data, error } = await client
        .from('products')
        .select('*')
        .eq('id', Number(id))
        .single();

    console.log("DATA:", data);
    console.log("ERROR:", error);

    const container = document.getElementById("product");

    if (error || !data) {
        container.innerHTML = "<p>❌ Product not found</p>";
        return;
    }

    container.innerHTML = `
        <div class="card">
            <h1>${data.name}</h1>
            <p class="price">R${data.price}</p>
            <p class="desc">${data.description || "No description available"}</p>
            <p>Seller: ${data.seller_name}</p>

            <button onclick='addToCart(${data.id}, ${JSON.stringify(data.name)}, ${data.price})'>
                Add to Cart
            </button>

            <button onclick="buyNow(${data.id})">
                Buy Now
            </button>
        </div>
    `;
}

// ✅ ADD TO CART + REDIRECT
function addToCart(id, name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // ✅ Prevent duplicates
    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        alert("✅ Already in cart");
        window.location.href = "index.html"; // redirect anyway
        return;
    }

    cart.push({
        id: id,
        name: name,
        price: price
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    console.log("UPDATED CART:", cart);

    alert("✅ Added to cart!");

    // ✅ REDIRECT TO HOME
    window.location.href = "index.html";
}

// ✅ BUY NOW (optional)
function buyNow(id) {
    alert("🚀 Checkout coming next");
}

loadProduct();
</script>

</body>
</html>
