<!DOCTYPE html>
<html>
<head><title>Sell</title></head>
<body style="background:#0f172a;color:white">

<h1>Sell Item</h1>

<input id="name" placeholder="Name"><br><br>
<input id="price" placeholder="Price"><br><br>
<textarea id="desc"></textarea><br><br>

<button onclick="post()">Post</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = supabase.createClient(
"https://lyvtjcnzeihsqvpzkced.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5dnRqY256ZWloc3F2cHprY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjAxODAsImV4cCI6MjA5NjEzNjE4MH0.YcMI_AKjUczeecLQcNq6OyPcfxOe7Z21hvacVW6qTfM"
);

async function post(){

const {data:{user}}=await supabase.auth.getUser();

if(!user){
alert("Login first");
return;
}

const {data:profile}=await supabase
.from('profiles')
.select('*')
.eq('id',user.id)
.single();

await supabase.from('products').insert([{
name:document.getElementById("name").value,
price:document.getElementById("price").value,
description:document.getElementById("desc").value,
seller_id:user.id,
seller_name:profile.full_name
}]);

alert("Submitted for approval");

}
</script>

</body>
</html>
